[workspace]
resolver = "3"
members = ["core", "app", "native-host", "et-data"]
# Patched third-party crates, not linted or tested as ours.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/PGHQdev/EmailTerminator"
rust-version = "1.93"

[workspace.dependencies]
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
et-core = { path = "core" }
keyring = "=4.2.0"
chacha20poly1305 = "=0.11.0"
dirs = "=7.0.0"
futures = "=0.3.34"
getrandom = "=0.4.3"
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "=2.11.6"
tauri-build = "=2.6.3"
tauri-plugin-single-instance = "=2.4.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "=1.1.6"
zeroize = "=1.9.0"

[profile.release]
strip = true

# mail-parser 0.11.9 with the fix for upstream issue #156 (PLAN.md M1).
[patch.crates-io]
mail-parser = { path = "vendor/mail-parser" }
