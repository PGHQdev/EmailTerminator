<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/styles.css">
<script src="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/_ds_bundle.js"></script>
</helmet>
<div style="width:86px;height:100%;background:var(--card,#fffdf8);border-right:1px solid var(--line,#ddd0b6);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;font-family:var(--font-body,sans-serif);box-sizing:border-box">
  <div style="width:36px;height:36px;border-radius:999px;background:var(--acc,#c67139);display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex:none">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"></path></svg>
  </div>
  <div style="width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;cursor:pointer;background:{{ hBg }};color:{{ hFg }}" style-hover="background:var(--card2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    <span style="font-size:10px;font-weight:800">Home</span>
  </div>
  <div style="width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;cursor:pointer;background:{{ sBg }};color:{{ sFg }}" style-hover="background:var(--card2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"></rect><path d="M2 10h20"></path></svg>
    <span style="font-size:10px;font-weight:800">Subs</span>
  </div>
  <div style="width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;cursor:pointer;background:{{ nBg }};color:{{ nFg }}" style-hover="background:var(--card2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m22 7-10 6L2 7"></path></svg>
    <span style="font-size:10px;font-weight:800">News</span>
  </div>
  <div style="width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;cursor:pointer;background:{{ lBg }};color:{{ lFg }}" style-hover="background:var(--card2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
    <span style="font-size:10px;font-weight:800">Log</span>
  </div>
  <div style="width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;cursor:pointer;background:{{ gBg }};color:{{ gFg }}" style-hover="background:var(--card2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <span style="font-size:10px;font-weight:800">Set</span>
  </div>
  <button title="{{ actionTitle }}" style="margin-top:auto;width:50px;height:50px;border-radius:999px;border:none;cursor:pointer;background:var(--acc,#c67139);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);flex:none" style-hover="filter:brightness(1.08)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:86,&quot;height&quot;:860},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Subs&quot;,&quot;News&quot;,&quot;Log&quot;,&quot;Set&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Clean up&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const v = {};
    for (const [k, name] of [['h','Home'],['s','Subs'],['n','News'],['l','Log'],['g','Set']]) {
      const on = name === active;
      v[k + 'Bg'] = on ? 'var(--sageSoft,#e4e8d5)' : 'transparent';
      v[k + 'Fg'] = on ? 'var(--sageDeep,#414d2e)' : 'var(--mut,#7a7264)';
    }
    v.actionTitle = this.props.action ?? 'Clean up';
    return v;
  }
}
</script>
</body>
</html>
