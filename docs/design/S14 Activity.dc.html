<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/styles.css">
<script src="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/_ds_bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>body{margin:0;--bg:var(--color-bg);--fg:var(--color-text);--hd:var(--color-text);--mut:var(--color-neutral-600);--card:#fffdf8;--card2:var(--color-neutral-100);--line:var(--color-neutral-300);--acc:var(--color-accent);--accDeep:var(--color-accent-700);--accSoft:var(--color-accent-100);--sage:var(--color-accent-2);--sageSoft:var(--color-accent-2-100);--sageDeep:var(--color-accent-2-800);--onSage:#fff;--dotOk:var(--color-accent-2);--dockBg:#fffdf8;--dockOn:var(--color-accent-2);--dockOnFg:#fff;--dockFg:var(--color-neutral-600);--dockLine:var(--color-neutral-200);--ok:var(--color-accent-2-700);--bad:var(--color-accent-800)}:root{--font-heading:'Bricolage Grotesque',sans-serif}a{color:var(--accDeep,var(--color-accent-700))}a:hover{opacity:.8}</style>
</helmet>
<div style="width:1280px;height:860px;position:relative;background:var(--bg);font-family:var(--font-body);color:var(--fg);overflow:hidden">
  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:28px 48px 0 122px">
    <div style="display:flex;align-items:baseline;gap:16px">
      <span style="font-family:var(--font-heading);font-weight:700;font-size:30px;color:var(--hd)">Activity</span>
      <span style="font-size:14px;color:var(--mut)">every action the app took, with receipts</span>
    </div>
    <div style="display:flex;gap:8px">
      <span style="background:var(--sageDeep);color:var(--sageSoft);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer">All · 41</span>
      <span style="background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer" style-hover="color:var(--fg)">Unsubscribes · 27</span>
      <span style="background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer" style-hover="color:var(--fg)">Cancellations · 9</span>
      <span style="background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer" style-hover="color:var(--fg)">Failures · 2</span>
      <span style="background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer" style-hover="color:var(--fg)">Syncs · 3</span>
    </div>
  </div>
  <div style="margin:20px 48px 0 122px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)">
    <div style="display:grid;grid-template-columns:1.7fr 1.1fr 1fr 1fr 1fr;padding:12px 24px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)">
      <span>Action</span><span>Target</span><span>When</span><span>Outcome</span><span>Evidence</span>
    </div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
      <div style="display:grid;grid-template-columns:1.7fr 1.1fr 1fr 1fr 1fr;align-items:center;padding:13px 24px;font-size:13.5px;border-bottom:1px solid var(--line)" style-hover="background:var(--card2)">
        <span style="display:flex;align-items:center;gap:10px;font-weight:600;color:var(--hd)"><span style="width:8px;height:8px;border-radius:999px;background:{{ r.dot }}"></span>{{ r.action }}</span>
        <span style="color:var(--mut)">{{ r.target }}</span>
        <span style="color:var(--mut);font-family:ui-monospace,Menlo,monospace;font-size:12.5px">{{ r.when }}</span>
        <span style="font-weight:700;font-size:12.5px;color:{{ r.oFg }}">{{ r.outcome }}</span>
        <a href="#" style="font-size:12.5px;font-weight:700;text-decoration:none">{{ r.evidence }}</a>
      </div>
    </sc-for>
  </div>
  <dc-import name="Rail" active="Log" style="position:absolute;left:0;top:0;bottom:0;width:86px" hint-size="86px,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  renderVals() {
    const R = (action, target, when, outcome, evidence, tone) => ({
      action, target, when, outcome, evidence,
      dot: tone === 'ok' ? 'var(--sage)' : tone === 'bad' ? 'var(--acc)' : 'var(--line)',
      oFg: tone === 'ok' ? 'var(--ok)' : tone === 'bad' ? 'var(--bad)' : 'var(--mut)'
    });
    return { rows: [
      R('One-click unsubscribe', 'The Dispatch', 'today 14:21', 'succeeded', 'sent email', 'ok'),
      R('One-click unsubscribe', 'LinkedIn', 'today 14:21', 'succeeded', 'sent email', 'ok'),
      R('One-click unsubscribe', 'Groupon', 'today 14:21', 'succeeded', 'sent email', 'ok'),
      R('Agent cancellation', 'Scribd', 'today 14:02', 'succeeded', 'session log', 'ok'),
      R('Agent cancellation', 'Hulu', 'today 13:48', 'needs you — CAPTCHA', 'session log', 'bad'),
      R('Playbook cancellation', 'NYTimes', 'yesterday 19:12', 'confirmed by email', 'confirmation', 'ok'),
      R('Unsubscribe', 'Bandcamp Weekly', 'yesterday 18:55', 'failed — no header', 'attempt log', 'bad'),
      R('Mailbox sync', 'alex@gmail.com', 'yesterday 18:00', '312 new messages', 'sync report', 'mut'),
      R('mbox import', 'personal-2019-2026.mbox', 'Aug 8 09:14', '17,188 parsed', 'import report', 'mut')
    ]};
  }
}
</script>
</body>
</html>
