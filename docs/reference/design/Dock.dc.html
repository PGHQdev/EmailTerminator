<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/styles.css">
<script src="_ds/organic-5588bfec-4a2c-478b-b965-0a1c6f9e0ae4/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--font-body,sans-serif)">
  <div style="display:flex;align-items:center;gap:4px;background:var(--dockBg,#fffdf8);border:1px solid var(--dockLine,#e5dac2);border-radius:999px;padding:7px 10px;box-shadow:var(--shadow-lg)">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;cursor:pointer;background:{{ it.bg }};color:{{ it.fg }};font-size:13.5px;font-weight:600">
        {{ it.icon }}{{ it.label }}
      </div>
    </sc-for>
  </div>
  <button title="Bulk clean-up" style="height:52px;min-width:52px;padding:{{ btnPad }};border-radius:999px;border:none;cursor:pointer;background:var(--acc,#c67139);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--font-body,sans-serif);font-size:14.5px;font-weight:700;box-shadow:var(--shadow-lg)" style-hover="filter:brightness(1.08)">
    {{ actionIcon }}{{ actionText }}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Subscriptions&quot;,&quot;Newsletters&quot;,&quot;Activity&quot;,&quot;Settings&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const e = React.createElement;
    const svg = (paths, sz) => e('svg', {width: sz || 15, height: sz || 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.75, strokeLinecap: 'round', strokeLinejoin: 'round', style: {flex: 'none'}}, ...paths);
    const P = d => e('path', {d}), R = (x,y,w,h,rx) => e('rect', {x,y,width:w,height:h,rx}), C = (cx,cy,r) => e('circle', {cx,cy,r});
    const icons = {
      Home: [P('m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z')],
      Subscriptions: [R(2,5,20,14,3), P('M2 10h20')],
      Newsletters: [R(2,4,20,16,3), P('m22 7-10 6L2 7')],
      Activity: [C(12,12,10), P('M12 6v6l4 2')],
      Settings: [C(12,12,3), P('M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4')]
    };
    const active = this.props.active ?? 'Home';
    const action = this.props.action ?? '';
    return {
      items: Object.keys(icons).map(label => ({
        label, icon: svg(icons[label]),
        bg: label === active ? 'var(--dockOn,#7a8a5e)' : 'transparent',
        fg: label === active ? 'var(--dockOnFg,#fff)' : 'var(--dockFg,#6b6355)'
      })),
      btnPad: action ? '0 22px 0 18px' : '0',
      actionText: action,
      actionIcon: svg([P('M13 2 3 14h7l-1 8 10-12h-7z')], action ? 16 : 21)
    };
  }
}
</script>
</body>
</html>
