[[playbook.steps]]
text = "Sign in at amazon.com and open the Cancel Your Prime Membership page."
link = "https://www.amazon.com/mm/pipeline/cancellation"

[[playbook.steps]]
text = "Follow the prompts to end your membership."

[[playbook.steps]]
text = "Paid members who have not used their benefits get a full refund of the current period."

[[playbook.steps]]
text = "Billed through Google Play? Cancel in Google Play's subscription settings instead."
